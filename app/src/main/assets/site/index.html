<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SafeScan</title><link rel="stylesheet" href="style.css"></head><body><main><header><span class="logo">✓</span><div><h1>SafeScan</h1><p>Lokale toestelcontrole</p></div></header><section class="score"><div id="ring"><b id="score">—</b><span>/100</span></div><h2 id="verdict">Klaar om te scannen</h2><p id="summary">De controle blijft volledig op dit toestel.</p><button class="primary" onclick="scanDevice()">↻ Scan opnieuw</button></section><section class="counts"><div class="safe"><b id="safe">0</b><span>Veilig</span></div><div class="warn"><b id="warn">0</b><span>Let op</span></div><div class="high"><b id="high">0</b><span>Hoog risico</span></div></section><h2 class="section-title">Resultaten</h2><section id="results" class="results"><div class="placeholder">Tik op ‘Scan opnieuw’ om de controle te starten.</div></section><section class="actions"><button onclick="exportReport()">▤ Rapport exporteren</button><button onclick="showAdvice()">◇ Advies</button></section><footer><span id="last">Nog niet gescand</span><span>Versie 1.6.3</span></footer></main><dialog id="detail"><form method="dialog"><div class="modalhead"><h2 id="detailTitle">Detail</h2><button value="cancel">×</button></div><p id="detailText"></p><div id="detailAdvice" class="advice"></div><button value="cancel" class="primary">Sluiten</button></form></dialog><div id="toast"></div><script src="i18n.js"></script><script src="app.js"></script></body></html>
